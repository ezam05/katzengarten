<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Apple Watch: Seite nicht verkleinern, sie ist schon für die Uhr gebaut -->
  <meta name="disabled-adaptations" content="watch">
  <meta name="theme-color" content="#0B1A12">
  <title>Katzengarten</title>
  <link rel="icon" href="bilder/icons/icon-180.png">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    html, body { height: auto; background: #0B1A12; color: #fff; }
    body { display: block !important; margin: 0; }
    .uhr { max-width: 240px; margin: 0 auto; padding: 4px 6px 12px; text-align: center; font-family: var(--schrift-titel); }
    .ring svg { width: 100%; height: auto; display: block; } /* Höhe kommt aus der viewBox, auch auf älteren Uhren */
    .noch { margin: 2px 0 0; font-size: 22px; font-weight: 700; line-height: 1.15; }
    .klein { margin: 3px 0 0; font-size: 13px; font-weight: 500; color: #B9D9C0; }
    .stand { margin: 6px 0 0; font-size: 11px; color: #7F9C88; }
    .uhr .katze-huelle.federn { animation: federn .6s cubic-bezier(.3, 1.4, .5, 1); }
    .knoepfe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0 0; }
    .knoepfe[hidden] { display: none; }
    .knoepfe button { min-height: 44px; border: 0; border-radius: 22px; background: #1E88D8; color: #fff; font: 600 14px var(--schrift-titel); }
    .knoepfe button:active { transform: scale(.94); }
    .mitteilung { width: 100%; min-height: 44px; margin: 12px 0 0; border: 0; border-radius: 22px; background: #F2734A; color: #fff; font: 600 15px var(--schrift-titel); cursor: pointer; }
    .mitteilung:disabled { background: #1F3A28; color: #B9D9C0; cursor: default; }
    .mitteilung[hidden], #mitteilung-text[hidden] { display: none; }
    /* Computer: etwas grösser und mit Luft oben */
    @media (min-width: 500px) { .uhr { max-width: 340px; padding-top: 6vh; } .noch { font-size: 30px; } .klein { font-size: 15px; } }
  </style>
</head>
<body>
<main class="uhr">
  <div class="ring"><svg id="ring" viewBox="-100 -100 200 200" role="img" aria-label="Deine Katze"></svg></div>
  <p class="noch" id="noch">…</p>
  <p class="klein" id="klein"></p>
  <div class="knoepfe" id="knoepfe" hidden>
    <button type="button" data-ml="100">💧1 dl</button><button type="button" data-ml="250">🥛2,5</button><button type="button" data-ml="500">🍶5 dl</button>
  </div>
  <button class="mitteilung" id="mitteilung" type="button" hidden>🔔 Erinnerungen auf diesem Gerät</button>
  <p class="klein" id="mitteilung-text" hidden></p>
  <p class="stand" id="stand"></p>
</main>
<script type="module">
  // Uhr-Ansicht: zeigt die Katze und wie viel du heute noch trinken musst.
  // Daten: aus dem Link (#n=…, von der App «Auf die Uhr») oder, auf demselben Gerät, direkt aus der App.
  import { artNachId, milchBisGross } from './js/arten.js';
  import { zeichneKatze } from './js/katze.js';
  import { ZIEL_ML, tagesSchluessel, eintraegeVomTag, summeMl, katzenZustand, groesseFuerMilch } from './js/regeln.js';

  // Mit Server (Link enthält i = öffentliche, x = geheime Nummer): live anzeigen und Wasser eintragen
  const hash = new URLSearchParams(location.hash.slice(1));
  const konto = { id: hash.get('i'), geheim: hash.get('x') };
  async function vomServer() {
    if (!konto.id) return null;
    try {
      const r = await fetch(`api/stand?id=${encodeURIComponent(konto.id)}`, { cache: 'no-store' });
      if (!r.ok) return null;
      const s = await r.json();
      const heute = tagesSchluessel(Date.now()) === tagesSchluessel(s.t);
      const heuteMl = heute ? Number(s.h) || 0 : 0;
      return { name: String(s.k?.n || 'Kätzchen'), artId: s.k?.a, milch: Number(s.k?.m) || 0, status: s.k?.s || 'waechst', heuteMl,
        zustand: s.k?.s === 'fertig' ? 'fertig' : katzenZustand({ heuteMl, jetzt: Date.now(), letzteTrinkZeit: heute ? s.t : null }), zeit: s.t, live: true };
    } catch { return null; }
  }

  const zahl = (z) => String(Math.round(z * 100) / 100).replace('.', ',');
  const liter = (ml) => `${zahl(ml / 1000)} l`;

  function ausLink() {
    const p = new URLSearchParams(location.hash.slice(1));
    if (!p.has('a')) return null;
    const t = Number(p.get('t')) || Date.now();
    const heute = tagesSchluessel(Date.now()) === tagesSchluessel(t);
    return {
      name: p.get('n') || 'Kätzchen', artId: p.get('a'), milch: Number(p.get('m')) || 0, status: p.get('s') || 'waechst',
      heuteMl: heute ? Number(p.get('h')) || 0 : 0, zustand: heute ? p.get('z') || 'gluecklich' : 'traurig', zeit: t,
    };
  }

  function ausApp() {
    try {
      const d = JSON.parse(localStorage.getItem('katzengarten-v1'));
      if (!d?.katze) return null;
      const jetzt = Date.now() + (d.demoVersatz || 0) * 864e5;
      const heute = eintraegeVomTag(d.eintraege || [], tagesSchluessel(jetzt));
      const heuteMl = summeMl(heute);
      const letzte = heute.length ? Math.max(...heute.map((e) => e.zeit)) : null;
      const zustand = d.katze.status === 'fertig' ? 'fertig' : katzenZustand({ heuteMl, jetzt, letzteTrinkZeit: letzte });
      return { name: d.katze.name, artId: d.katze.artId, milch: d.katze.milch, status: d.katze.status, heuteMl, zustand, zeit: null };
    } catch { return null; }
  }

  let k = (await vomServer()) || ausLink() || ausApp() || { name: 'Mimi', artId: 'toast', milch: 0, status: 'waechst', heuteMl: 0, zustand: 'traurig', zeit: null };

  function zeige() {
  const art = artNachId(k.artId);
  const bisGross = milchBisGross(art);
  const anteil = Math.min(1, k.heuteMl / ZIEL_ML);
  const umfang = 2 * Math.PI * 88;

  let mitte;
  if (k.status === 'weg') {
    mitte = `<text x="0" y="10" text-anchor="middle" font-size="44">🐾</text>`;
  } else {
    const { svg } = zeichneKatze({ art, groesse: groesseFuerMilch(k.milch, bisGross), zustand: k.zustand, effekte: false });
    mitte = `<g transform="translate(0 52) scale(.6)"><g class="katze-huelle" id="katze">${svg}</g></g>`;
  }
  document.getElementById('ring').innerHTML = `
    <defs><clipPath id="kreis"><circle r="78"/></clipPath>
      <linearGradient id="wiese" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FB4F0"/><stop offset=".62" stop-color="#BFE6F5"/><stop offset=".62" stop-color="#9BD65A"/><stop offset="1" stop-color="#6DBB45"/></linearGradient></defs>
    <circle r="88" fill="none" stroke="#1F3A28" stroke-width="13"/>
    <circle r="88" fill="none" stroke="#49B4F0" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${(umfang * anteil).toFixed(1)} ${umfang.toFixed(1)}" transform="rotate(-90)"/>
    <g clip-path="url(#kreis)"><rect x="-80" y="-80" width="160" height="160" fill="url(#wiese)"/>${mitte}</g>`;

  const rest = Math.max(0, ZIEL_ML - k.heuteMl);
  document.getElementById('noch').textContent = k.status === 'weg'
    ? `${k.name} ist abgehauen 😿`
    : rest > 0 ? `Noch ${liter(rest)} 💧` : 'Geschafft! 🎉';
  document.getElementById('klein').textContent = k.status === 'weg'
    ? 'Hol ein neues Kätzchen in der App'
    : `${k.name} · heute ${liter(k.heuteMl)} · 🍼 ${zahl(k.milch / 1000)}/${bisGross / 1000} l`;
  if (k.zeit) {
    const d = new Date(k.zeit);
    document.getElementById('stand').textContent = `Stand ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  }
  document.getElementById('ring').setAttribute('aria-label', `${k.name}, ${art.name}. ${document.getElementById('noch').textContent}`);
  }
  zeige();

  // Wasser eintragen: geht an den Server, das iPhone holt es ab und füttert die Katze
  const knoepfe = document.getElementById('knoepfe');
  knoepfe.hidden = !(k.live && konto.geheim);
  knoepfe.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const ml = Number(b.dataset.ml);
    b.disabled = true;
    try {
      const r = await fetch('api/trinken', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: konto.id, geheim: konto.geheim, aktion: 'eintragen', ml }) });
      if (!r.ok) throw new Error();
      k = { ...k, heuteMl: k.heuteMl + ml, zustand: 'gluecklich', zeit: Date.now() };
      zeige();
      document.getElementById('stand').textContent = `+${String(ml / 100).replace('.', ',')} dl ✓ Das iPhone füttert die Katze.`;
    } catch {
      document.getElementById('stand').textContent = 'Kein Netz 😿 Nochmals versuchen.';
    }
    b.disabled = false;
  });

  // Live: jede Minute (und beim Zurückkommen) den neusten Stand holen, z. B. auf dem Computer
  if (konto.id) {
    const neuLaden = async () => { const neu = await vomServer(); if (neu) { k = neu; zeige(); } };
    setInterval(neuLaden, 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) neuLaden(); });
  }

  // Mitteilungen auf diesem Gerät (z. B. Computer): gleiche Katze wie auf dem Handy, darum über den Link mit den Nummern.
  // Auf der Uhr gibt es keine Mitteilungen aus dem Browser, dort bleibt der Knopf versteckt.
  const knopf = document.getElementById('mitteilung');
  const knopfText = document.getElementById('mitteilung-text');
  const kannPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const sag = (t) => { knopfText.textContent = t; knopfText.hidden = !t; };
  const zeigeKnopf = (an) => {
    knopf.disabled = an;
    knopf.textContent = an ? '🔔 Erinnerungen sind an' : '🔔 Erinnerungen auf diesem Gerät';
    sag(an ? 'Hast du 5 Stunden nichts getrunken, meldet sich deine Katze auch hier. Antippen öffnet diese Seite.' : 'Dann meldet sich deine Katze auch hier, wenn du trinken sollst.');
  };
  const bytes = (b64) => Uint8Array.from(atob((b64 + '='.repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  if (k.live && konto.geheim && kannPush) {
    const reg = await navigator.serviceWorker.register('sw.js').catch(() => null);
    if (reg) {
      knopf.hidden = false;
      zeigeKnopf(Notification.permission === 'granted' && !!(await reg.pushManager.getSubscription().catch(() => null)));
      knopf.addEventListener('click', async () => {
        try {
          if (await Notification.requestPermission() !== 'granted') { sag('Mitteilungen sind im Browser nicht erlaubt. Du kannst sie in den Einstellungen einschalten.'); return; }
          const bereit = await navigator.serviceWorker.ready;
          const { schluessel } = await (await fetch('api/push?aktion=schluessel')).json();
          const abo = await bereit.pushManager.getSubscription()
            || await bereit.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: bytes(schluessel) });
          const r = await fetch('api/push', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: konto.id, geheim: konto.geheim, aktion: 'abo', abo: abo.toJSON() }) });
          if (!r.ok) throw new Error();
          // Antippen der Mitteilung soll diese Seite öffnen (die App wäre auf diesem Gerät leer), siehe sw.js
          await (await caches.open('katzengarten-ziel')).put('ziel', new Response(location.href));
          zeigeKnopf(true);
        } catch {
          sag('Das hat nicht geklappt 😿 Hast du Internet?');
        }
      });
    }
  }

  // Antippen: Katze federt
  document.getElementById('ring').addEventListener('click', () => {
    const katze = document.getElementById('katze');
    if (!katze) return;
    katze.classList.remove('federn');
    void katze.getBBox();
    katze.classList.add('federn');
  });
</script>
</body>
</html>
